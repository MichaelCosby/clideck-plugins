<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>System monitor</title>
<!-- Runs in a sandboxed workspace frame. It links CliDeck's own stylesheet for the theme tokens and talks to the
     plugin's backend only through postMessage (clideck.ready / clideck.send up; init, message, theme, visible down). -->
<link rel="stylesheet" href="/css/app.css">
<style>
  /* Series hues: the dataviz reference palette's slots 1-2, stepped per theme and validated on CliDeck's surfaces. */
  :root { --ram:#3987e5; --swap:#d95926; --load:#3987e5; }
  :root[data-theme="light"] { --ram:#2a78d6; --swap:#eb6834; --load:#2a78d6; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg-side); color:var(--text); font-family:var(--sans); font-size:13px; overflow:auto; }
  main { max-width:980px; padding:16px; display:flex; flex-direction:column; gap:16px; }
  .top { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:15px; font-weight:600; }
  .muted { color:var(--faint); font-size:12px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
  .tile { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; }
  .tile-label { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:7px; }
  .swatch { width:9px; height:9px; border-radius:2px; flex:0 0 auto; }
  .tile-value { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tile-sub { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .status { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:999px; }
  .status.warning { color:var(--working); background:color-mix(in srgb, var(--working) 15%, transparent); }
  .status.critical { color:var(--danger); background:color-mix(in srgb, var(--danger) 15%, transparent); }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:12px 14px 10px; display:flex; flex-direction:column; gap:8px; }
  .card-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  h2 { margin:0; font-size:13px; font-weight:600; }
  .legend { display:flex; gap:14px; color:var(--dim); font-size:12px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .chart { position:relative; }
  .chart svg { display:block; width:100%; height:170px; overflow:visible; }
  .chart .grid line { stroke:var(--border); stroke-width:1; }
  .chart .axis text { fill:var(--faint); font-size:10.5px; font-family:var(--sans); font-variant-numeric:tabular-nums; }
  .chart .threshold { stroke-width:1; stroke-dasharray:4 4; fill:none; }
  .chart .threshold.warning { stroke:var(--working); }
  .chart .threshold.critical { stroke:var(--danger); }
  .chart .threshold.cores { stroke:var(--faint); }
  .chart .line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .chart .end { stroke:var(--surface-1); stroke-width:2; }
  .chart .end-label { fill:var(--text); font-size:11px; font-family:var(--sans); font-variant-numeric:tabular-nums; }
  .chart .cross { stroke:var(--dim); stroke-width:1; }
  .tip { position:absolute; top:0; pointer-events:none; background:var(--surface-2); border:1px solid var(--border-strong, var(--border)); border-radius:8px; padding:7px 9px; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; box-shadow:0 8px 22px -10px rgba(0,0,0,.45); }
  .tip div { display:flex; align-items:center; gap:6px; }
  .tip .when { color:var(--dim); margin-bottom:3px; }
  .empty { color:var(--faint); padding:28px 0; text-align:center; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-weight:500; color:var(--dim); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--border); }
  td { padding:7px 8px; border-bottom:1px solid var(--border); }
  td.num, th.num { text-align:right; }
  .share { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .share-bar { width:80px; height:6px; border-radius:3px; background:var(--border); overflow:hidden; }
  .share-bar i { display:block; height:100%; background:var(--ram); border-radius:3px; }
  .table-wrap { overflow-x:auto; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; }
  details table { margin-top:8px; }
</style>
</head>
<body>
<main id="app"><div class="empty">Reading system stats…</div></main>
<script>
(() => {
  "use strict";
  const POLL_MS = 5000;
  const TOKEN = (() => { try { return crypto.randomUUID().slice(0, 8); } catch { return Math.random().toString(36).slice(2, 10); } })();
  const app = document.getElementById("app");
  let visible = true, timer = null, seq = 0, pending = null, data = null;

  const up = (message) => { try { parent.postMessage(message, "*"); } catch {} };
  window.addEventListener("message", (event) => {
    if (event.source !== parent) return;
    const message = event.data || {};
    if (message.type === "clideck.init") {
      const d = message.data || {};
      theme(d.theme);
      visible = d.visible !== false;
      if (visible) { request(); schedule(); }
    } else if (message.type === "clideck.theme") {
      theme(message.data && message.data.theme);
      if (data) render();
    } else if (message.type === "clideck.visible") {
      const next = !!(message.data && message.data.visible);
      if (next === visible) return;
      visible = next;
      if (visible) { request(); schedule(); } else { clearTimeout(timer); timer = null; }
    } else if (message.type === "clideck.message" && message.data && message.data.event === "stats") {
      const reply = message.data.data || {};
      if (reply.requestId !== pending) return;
      pending = null;
      data = reply;
      render();
    }
  });
  function theme(name) { if (name === "light" || name === "dark") document.documentElement.setAttribute("data-theme", name); }
  function request() { pending = TOKEN + "-" + (++seq); up({ type: "clideck.send", event: "stats-request", data: { requestId: pending } }); }
  function schedule() { clearTimeout(timer); timer = setTimeout(() => { if (visible) { request(); schedule(); } }, POLL_MS); }
  window.addEventListener("resize", () => { if (data) render(); });

  // ── formatting ──
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const gib = (n) => (n == null ? "?" : (n / 1024 ** 3).toFixed(1) + " GiB");
  const size = (n) => (n >= 1024 ** 3 ? (n / 1024 ** 3).toFixed(2) + " GiB" : Math.round(n / 1024 ** 2) + " MiB");
  const pct = (n) => (n == null ? "—" : Math.round(n) + "%");
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  const levelOf = (value, warn, critical) => (value == null ? "ok" : value >= critical ? "critical" : value >= warn ? "warning" : "ok");
  const ICON = { warning: "▲", critical: "●" };
  const statusChip = (level) => (level === "ok" ? "" : `<span class="status ${level}"><span aria-hidden="true">${ICON[level]}</span>${level === "critical" ? "Critical" : "Warning"}</span>`);

  function render() {
    const l = data.latest;
    if (!l) { app.innerHTML = '<div class="empty">Reading system stats…</div>'; return; }
    // macOS: RAM runs high by design and swap grows as needed, so neither warns; the kernel's memory pressure does.
    const ramCounts = l.ramAlerts !== false, swapCounts = l.swapAlerts !== false;
    const pressureLevel = l.pressure === "warning" || l.pressure === "critical" ? l.pressure : "ok";
    const rank = { ok: 0, warning: 1, critical: 2 };
    const percentLevel = ramCounts ? levelOf(l.ramPct, l.warn, l.critical) : "ok";
    const ramLevel = rank[pressureLevel] > rank[percentLevel] ? pressureLevel : percentLevel;
    const swapLevel = swapCounts ? levelOf(l.swapPct, l.warn, l.critical) : "ok";
    const swapLine = swapCounts && l.swapPct != null;
    const loadLevel = l.load && l.cpus ? (l.load[0] > l.cpus ? "warning" : "ok") : "ok";
    app.innerHTML = `
      <div class="top"><h1>System monitor</h1><span class="muted">Updated ${esc(clock(l.at))}${l.approx ? " · RAM is approximate on this platform" : ""}</span></div>
      <section class="tiles" aria-label="Current usage">
        <div class="tile"><div class="tile-label"><span class="swatch" style="background:var(--ram)"></span>RAM ${statusChip(ramLevel)}</div>
          <div class="tile-value">${pct(l.ramPct)}</div><div class="tile-sub">${gib(l.memUsed)} of ${gib(l.memTotal)}${l.pressure ? ` · pressure ${esc(l.pressure)}` : ""}${l.memFreePct != null ? ` · ${Math.round(l.memFreePct)}% free (macOS)` : ""}</div></div>
        <div class="tile"><div class="tile-label"><span class="swatch" style="background:var(--swap)"></span>Swap ${statusChip(swapLevel)}</div>
          <div class="tile-value">${!swapCounts ? gib(l.swapUsed) : l.swapPct == null ? "None" : pct(l.swapPct)}</div><div class="tile-sub">${!swapCounts ? `used · ${gib(l.swapTotal)} allocated, grows as needed` : l.swapPct == null ? "No swap configured" : gib(l.swapUsed) + " of " + gib(l.swapTotal)}</div></div>
        <div class="tile"><div class="tile-label">Load average ${statusChip(loadLevel)}</div>
          <div class="tile-value">${l.load ? l.load[0].toFixed(2) : "—"}</div><div class="tile-sub">${l.load ? `5m ${l.load[1].toFixed(2)} · 15m ${l.load[2].toFixed(2)} · ${l.cpus} cores` : "Not available on this platform"}</div></div>
      </section>
      <section class="card"><div class="card-head"><h2>Memory use, last 15 minutes</h2>
        <div class="legend"><span><span class="swatch" style="background:var(--ram)"></span>RAM</span>${!swapLine ? "" : '<span><span class="swatch" style="background:var(--swap)"></span>Swap</span>'}</div></div>
        <div class="chart" id="mem-chart"></div></section>
      ${l.load ? `<section class="card"><div class="card-head"><h2>Load average (1 minute), last 15 minutes</h2><span class="muted">Dashed line: ${l.cpus} cores</span></div><div class="chart" id="load-chart"></div></section>` : ""}
      <section class="card"><div class="card-head"><h2>Memory by session</h2><span class="muted">Each agent plus every process it started</span></div>${sessionTable(l)}</section>
      <section class="card"><details><summary>Samples as a table</summary><div class="table-wrap">${sampleTable(data.history, l)}</div></details></section>`;
    const hist = data.history || [];
    chart(document.getElementById("mem-chart"), hist, {
      max: 100, unit: "%", ticks: [0, 25, 50, 75, 100],
      series: [{ key: "ramPct", label: "RAM", color: "var(--ram)" }, ...(!swapLine ? [] : [{ key: "swapPct", label: "Swap", color: "var(--swap)" }])],
      rules: ramCounts || swapLine ? [{ value: l.warn, cls: "warning", label: "Warning" }, { value: l.critical, cls: "critical", label: "Critical" }] : [],
    });
    if (l.load) {
      const peak = Math.max(l.cpus, ...hist.map((h) => h.load1 || 0));
      const top = Math.ceil(peak * 1.15);
      chart(document.getElementById("load-chart"), hist, {
        max: top, unit: "", decimals: 2, ticks: [0, Math.round(top / 2), top],
        series: [{ key: "load1", label: "Load", color: "var(--load)" }],
        rules: [{ value: l.cpus, cls: "cores", text: `${l.cpus} cores` }],
      });
    }
  }

  function sessionTable(l) {
    if (!l.sessions || !l.sessions.length) return '<div class="empty">No running sessions, or process memory is unavailable here.</div>';
    const rows = l.sessions.map((s) => {
      const share = l.memTotal ? (s.bytes / l.memTotal) * 100 : 0;
      return `<tr><td>${esc(s.name)}</td><td>${esc(s.provider)}</td><td class="num">${s.processes}</td><td class="num">${size(s.bytes)}</td>
        <td class="num"><div class="share"><span>${share.toFixed(1)}%</span><span class="share-bar" aria-hidden="true"><i style="width:${Math.min(100, share)}%"></i></span></div></td></tr>`;
    }).join("");
    return `<div class="table-wrap"><table><thead><tr><th>Session</th><th>Agent</th><th class="num">Processes</th><th class="num">Memory</th><th class="num">Share of RAM</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function sampleTable(hist, l) {
    const rows = hist.slice().reverse().map((h) => `<tr><td>${esc(clock(h.at))}</td><td class="num">${pct(h.ramPct)}</td>${!(l.swapAlerts !== false && l.swapPct != null) ? "" : `<td class="num">${pct(h.swapPct)}</td>`}<td class="num">${h.load1 == null ? "—" : h.load1.toFixed(2)}</td></tr>`).join("");
    return `<table><thead><tr><th>Time</th><th class="num">RAM</th>${!(l.swapAlerts !== false && l.swapPct != null) ? "" : '<th class="num">Swap</th>'}<th class="num">Load (1m)</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // ── a small line chart: one y-axis, recessive grid, dashed reference rules, direct end labels, hover readout ──
  function chart(host, hist, opt) {
    const points = hist.filter((h) => opt.series.some((s) => h[s.key] != null));
    if (points.length < 2) { host.innerHTML = '<div class="empty">Collecting samples…</div>'; return; }
    const W = Math.max(280, host.clientWidth || 600), H = 170;
    const m = { l: 34, r: 78, t: 10, b: 22 };
    const t0 = points[0].at, t1 = points[points.length - 1].at;
    const x = (t) => m.l + ((t - t0) / Math.max(1, t1 - t0)) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - Math.min(v, opt.max) / opt.max) * (H - m.t - m.b);
    const fmt = (v) => (opt.decimals ? v.toFixed(opt.decimals) : Math.round(v)) + opt.unit;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.series.map((s) => s.label).join(" and "))} over the last 15 minutes">`;
    svg += '<g class="grid">' + opt.ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`).join("") + "</g>";
    svg += '<g class="axis">' + opt.ticks.map((v) => `<text x="${m.l - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}${opt.unit}</text>`).join("");
    const minutes = Math.round((t1 - t0) / 60000);
    svg += `<text x="${m.l}" y="${H - 5}">${minutes ? "−" + minutes + "m" : "now"}</text><text x="${W - m.r}" y="${H - 5}" text-anchor="end">now</text></g>`;
    // Every label on the right edge (threshold rules and line ends) is spaced as one set, so none overlap.
    const labels = [];
    for (const r of opt.rules) {
      if (r.value == null || r.value > opt.max) continue;
      svg += `<line class="threshold ${r.cls}" x1="${m.l}" x2="${W - m.r}" y1="${y(r.value)}" y2="${y(r.value)}"/>`;
      labels.push({ y: y(r.value), text: r.text || `${r.label} ${fmt(r.value)}`, muted: true });
    }
    for (const s of opt.series) {
      const pts = points.filter((p) => p[s.key] != null);
      if (!pts.length) continue;
      svg += `<path class="line" style="stroke:${s.color}" d="${pts.map((p, i) => (i ? "L" : "M") + x(p.at).toFixed(1) + " " + y(p[s.key]).toFixed(1)).join(" ")}"/>`;
      const last = pts[pts.length - 1];
      svg += `<circle class="end" cx="${x(last.at)}" cy="${y(last[s.key])}" r="4" style="fill:${s.color}"/>`;
      labels.push({ y: y(last[s.key]), text: `${s.label} ${fmt(last[s.key])}` });
    }
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 13);
    const overflow = labels.length ? labels[labels.length - 1].y - (H - m.b) : 0;
    if (overflow > 0) for (const l of labels) l.y -= overflow;
    for (const l of labels) svg += `<text class="end-label" x="${W - m.r + 8}" y="${l.y + 3.5}"${l.muted ? ' style="fill:var(--faint)"' : ""}>${esc(l.text)}</text>`;
    svg += `<g class="hover" visibility="hidden"><line class="cross" y1="${m.t}" y2="${H - m.b}"/>${opt.series.map((s) => `<circle class="end" r="4" data-key="${s.key}" style="fill:${s.color}"/>`).join("")}</g>`;
    svg += `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg>`;
    host.innerHTML = svg + '<div class="tip" hidden></div>';
    const el = host.querySelector("svg"), hover = el.querySelector(".hover"), tip = host.querySelector(".tip");
    const show = (event) => {
      const box = el.getBoundingClientRect();
      const px = ((event.clientX - box.left) / box.width) * W;
      let best = points[0];
      for (const p of points) if (Math.abs(x(p.at) - px) < Math.abs(x(best.at) - px)) best = p;
      const cx = x(best.at);
      hover.setAttribute("visibility", "visible");
      const cross = hover.querySelector(".cross"); cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
      for (const dot of hover.querySelectorAll("circle")) {
        const v = best[dot.dataset.key];
        dot.setAttribute("visibility", v == null ? "hidden" : "visible");
        if (v != null) { dot.setAttribute("cx", cx); dot.setAttribute("cy", y(v)); }
      }
      tip.innerHTML = `<div class="when">${esc(clock(best.at))}</div>` + opt.series.filter((s) => best[s.key] != null)
        .map((s) => `<div><span class="swatch" style="background:${s.color}"></span>${esc(s.label)} ${fmt(best[s.key])}</div>`).join("");
      tip.hidden = false;
      const left = (cx / W) * box.width;
      tip.style.left = Math.min(Math.max(0, left + 12), box.width - tip.offsetWidth) + "px";
    };
    el.addEventListener("pointermove", show);
    el.addEventListener("pointerleave", () => { hover.setAttribute("visibility", "hidden"); tip.hidden = true; });
  }

  up({ type: "clideck.ready" });
})();
</script>
</body>
</html>
